on:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string
      tool_version:
        required: true
        type: string
      prepare_body:
        required: true
        type: string
      artifacts:
        required: true
        type: string
    secrets:
      token:
        required: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt update -y
          sudo apt install -y libarchive-tools
      - uses: actions/download-artifact@v4
      - run: ${{ inputs.prepare_body }}
      - uses: ncipollo/release-action@v1
        with:
          tag: "${{ inputs.workflow }}-${{ inputs.tool_version }}"
          # tag the tested PR commit instead of the current master HEAD;
          # retag-on-merge.yml moves it to the squash commit once the PR is merged
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
          bodyFile: './body.md'
          artifacts: ${{ inputs.artifacts }}
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
