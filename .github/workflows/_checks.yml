name: _checks

on: [pull_request, workflow_dispatch]

jobs:
  version_tests:
    runs-on: ubuntu-latest
    container: python:3.11.4-alpine3.17
    steps:
      - uses: actions/checkout@v4
      - name: version tests
        run: |
          python -m unittest discover --start-directory .tools --pattern=*_tests.py

  editorconfig:
    runs-on: ubuntu-latest
    container: node:18.16.0-alpine3.18
    steps:
      - uses: actions/checkout@v4
      # npm wrapper always downloads the latest release, ec-* assets were removed in v4
      - run: |
          EC_VERSION=v3.11.3
          wget -qO- "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/$EC_VERSION/ec-linux-amd64.tar.gz" | tar -xz -C /tmp bin/ec-linux-amd64
          /tmp/bin/ec-linux-amd64 --version
          /tmp/bin/ec-linux-amd64
